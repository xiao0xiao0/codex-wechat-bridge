name: Validate public release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release structure and PowerShell syntax
        shell: pwsh
        run: ./tests/Validate-PublicRelease.ps1
      - name: Validate WeChat sync cursor recovery
        shell: pwsh
        run: ./tests/Validate-SyncRecovery.ps1
      - name: Validate fork replay guard
        shell: pwsh
        run: ./tests/Validate-ForkReplayGuard.ps1
      - name: Validate rollout task identity
        shell: pwsh
        run: ./plugins/codex-wechat-bridge/tests/Test-RolloutIdentity.ps1
      - name: Validate quoted reply after task rename
        shell: pwsh
        run: ./plugins/codex-wechat-bridge/tests/Test-ThreadRename.ps1
      - name: Validate bounded notification refresh
        shell: pwsh
        run: ./plugins/codex-wechat-bridge/tests/Test-NotificationRefresh.ps1
      - name: Validate durable reply codes and exact targeting
        shell: pwsh
        run: ./plugins/codex-wechat-bridge/tests/Test-ReplyCodes.ps1
